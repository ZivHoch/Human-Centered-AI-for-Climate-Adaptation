<!DOCTYPE html>
<html lang="en">
  <head>
  <meta charset="UTF-8" />
  <title>I-DEAP – Interactive Climate Adaptation Tool</title>

  <!-- Mobile / layout -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Basic description -->
  <meta
    name="description"
    content="Interactive decision-support system combining multi-objective optimization, explainable AI, and visual analytics to explore sustainable climate adaptation pathways."
  />

  <!-- Open Graph (LinkedIn, Facebook, etc.) -->
  <meta property="og:title" content="I-DEAP – Interactive Climate Adaptation Tool" />
  <meta
    property="og:description"
    content="Visual analytics and explainable AI for exploring climate adaptation pathways using multi-objective optimization."
  />
  <meta property="og:type" content="website" />
  <meta
    property="og:url"
    content="https://human-centered-ai-for-climate-adapt.vercel.app/"
  />
  <!-- IMPORTANT: use a full absolute URL here -->
  <meta
    property="og:image"
    content="https://human-centered-ai-for-climate-adapt.vercel.app/images/og-image.jpg"
  />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="I-DEAP – Interactive Climate Adaptation Tool" />
  <meta
    name="twitter:description"
    content="Interactive decision-support for climate adaptation using multi-objective optimization, explainable AI, and visual analytics."
  />
  <meta
    name="twitter:image"
    content="https://human-centered-ai-for-climate-adapt.vercel.app/images/og-image.jpg"
  />

  <link rel="icon" href="images/logo.png" />

  <!-- CSS imports -->
  <link rel="stylesheet" href="css/LineUpJS.css" />
  <link rel="stylesheet" href="css/jquery-ui.css" />
  <link rel="stylesheet" href="css/d3.tip.css" />
  <link rel="stylesheet" href="css/material.min.css" />
  <link rel="stylesheet" href="css/w3.css" />
  <link rel="stylesheet" href="css/whhg.css" />
  <link rel="stylesheet" href="css/style_largefont.css" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/bootstrap.min.css" />
  <link href="fonts/opensans.css" rel="stylesheet" type="text/css" />
  <link rel="stylesheet" href="css/headerstyle.css" />

  <!-- JavaScript imports -->
  <script src="js/d3.js" charset="utf-8"></script>
  <script src="js/d3.tip.js" charset="utf-8"></script>
  <script src="js/compatibility.js" charset="utf-8"></script>
  <script src="js/jquery-1.12.4.js"></script>
  <script src="js/jquery-ui.js"></script>
  <script src="js/bootstrap.min.js"></script>
  <script src="js/datasets.js"></script>
  <script src="js/svg-dropdown.js"></script>
  <script src="js/main.js"></script>
  <script src="js/dynamicfca.js"></script>
  <script src="js/LineUpJS.js"></script>

  <style>
    .pageLinks {
      margin-left: 10px;
      display: inline;
    }
    .form-control {
      padding: 0px 12px;
      margin-top: 4px;
      margin-bottom: 4px;
      height: 24px;
      width: calc(100% - 30px);
      display: inline-block;
    }
  </style>
</head>

  <body>
    <!-- Modal for dataset information -->
    <div id="id01" class="w3-modal">
      <div class="w3-modal-content w3-animate-top">
        <header class="w3-container w3-black">
          <span onclick="datasetSelection.toggleDataSetInformation()" class="w3-button w3-display-topright">&times;</span>
          <h2>Dataset Information</h2>
        </header>
        <div class="w3-container">
          <div id="datasetInformation"></div>
        </div>
      </div>
    </div>

    <!-- Main content -->
    <div id="main">
      <div id="leftPanel">
        <div id="header">
          <div class="logo-title">
            <img src="images/logo.png" alt="Streams logo" class="logo" />
            <h1 class="title">Multi-Objective Visual Analytics to Develop Sustainable Adaptation Pathways</h1>
          </div>

          <ul class="dataset-stats gh-stats">
            <li>
              <div class="stat">
                <span id="numSets" class="count"></span>
                <span class="label">Infrastructures</span>
              </div>
            </li>
            <li>
              <div class="stat">
                <span id="numObjects" class="count"></span>
                <span class="label">Simulations</span>
              </div>
            </li>
            <li>
              <div class="stat">
                <span id="numTimesteps" class="count"></span>
                <span class="label">Timestamps</span>
              </div>
            </li>
            <li>
              <div class="stat">
                <span id="numIntersections" class="count"></span>
                <span class="label">Deployment Patterns</span>
              </div>
            </li>
          </ul>
          <div class="controls">
            <label for="datasetDropDown">Select bin count:</label>
            <div class="input-group">
              <select id="datasetDropDown">
                <option value="" disabled selected>Choose…</option>
                <!-- your options -->
              </select>
              <button type="button" class="info-btn" title="Dataset information" onclick="datasetSelection.toggleDataSetInformation()">
                <i class="icon icon-info-sign"></i>
              </button>
            </div>
          </div>
        </div>
        <div id="selectionPanel">
          <div><label class="col">Selection:</label></div>
          <div id="selectionAB"><span class="groupLabel groupAB">Group A+B</span></div>
          <div id="selectionA"></div>
          <div id="selectionB"></div>
        </div>
        <div id="lineupVisualization" class="lineUpContainer"></div>
        <div id="WrapForScroll">
          <div class="scrollable-frame">
            <div class="visualization-content">
              <!-- Visualization content goes here -->
              <div id="mainVisualization"></div>
            </div>
          </div>
        </div>
      </div>

      <div id="rightPanel">
        <div id="selectionDetailsContainer" class="labeledContainer">
          <div>
            <div class="viewTitle" id="detailsHeader">Highlighted Element</div>
          </div>
          <div class="borderDiv" id="highlightedElement"></div>
        </div>

        <div id="listExampleContainer" class="labeledContainer">
          <div>
            <div class="viewTitle">Element List</div>
          </div>
          <div class="borderDiv">
            <div id="searchPanel">
              <div class="md-form active-purple active-purple-2 mb-3">
                <input class="form-control" type="text" placeholder="Search Element" aria-label="Search" id="searchInput" />
              </div>
            </div>
            <div id="listLegend">
              <div class="coloredDivBar groupAB groupLegendDiv"></div>
              <span id="countAB" class="groupCount">: 0</span>
              <div class="coloredDivBar groupA groupLegendDiv"></div>
              <span id="countA" class="groupCount">: 0</span>
              <div class="coloredDivBar groupB groupLegendDiv"></div>
              <span id="countB" class="groupCount">: 0</span>
            </div>
            <!-- <div style="border-bottom: #636363 1px solid"></div> -->
            <table id="listExample"></table>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
